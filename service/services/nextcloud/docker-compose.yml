version: '3'

services:
  db:
    image: "mariadb:10.6"
    restart: "always"
    command: "--transaction-isolation=READ-COMMITTED --binlog-format=ROW"
    volumes:
      - "db:/var/lib/mysql"
    environment:
      - "MYSQL_ROOT_PASSWORD=${DB_PWD}"
      - "MYSQL_PASSWORD=${DB_PWD}"
      - "MYSQL_DATABASE=nextcloud"
      - "MYSQL_USER=nextcloud"
    networks:
      - "net"

  app:
    image: "nextcloud:latest"
    restart: "always"
    ports:
      - "8080:80"
    volumes:
      - "nextcloud:/var/www/html:z"
    environment:
      - "MYSQL_PASSWORD=${DB_PWD}"
      - "MYSQL_DATABASE=nextcloud"
      - "MYSQL_USER=nextcloud"
      - "MYSQL_HOST=db"
      - "NEXTCLOUD_ADMIN_USER=anthony"
      - "NEXTCLOUD_ADMIN_PASSWORD=${AD_PWD}"
      - "NEXTCLOUD_TRUSTED_DOMAINS=*"
      - "VIRTUAL_HOST=nextcloud.anthony.com"
      - "VIRTUAL_PORT=80"
      - "LETSENCRYPT_HOST=nextcloud.anthony.com"
      - "LETSENCRYPT_EMAIL=email"
    depends_on:
      - "db"
    networks:
      - "net"

volumes:
  db:
  nextcloud:

networks:
  net:
    external: true
